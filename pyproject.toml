[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-opt-project"
version = "0.1.0"
description = "Topology optimisation with PyTorch and PETSc"
readme = "README.md"
license = {text = "MIT AND GPL-3.0-or-later"}
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "torch",
    "petsc4py",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "mmapy==0.3.1",
    "numba>=0.68.1,<0.69",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28", "fastapi>=0.115", "uvicorn>=0.30"]
ui = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
toptvis-cantilever = "ml_opt.cli:main"
toptvis-ui = "ml_opt.web.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "src/ml_opt/optimizers/GPL-3.0-or-later.txt"]

[tool.setuptools.package-data]
"ml_opt.web" = ["static/*"]
"ml_opt.optimizers" = ["GPL-3.0-or-later.txt"]
