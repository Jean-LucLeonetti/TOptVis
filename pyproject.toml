[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-opt-project"
version = "0.1.0"
description = "Topology optimisation with PyTorch and PETSc"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "torch",
    "petsc4py",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "mmapy==0.3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
toptvis-cantilever = "ml_opt.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
